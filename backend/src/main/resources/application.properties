# Packaged fallbacks. These are NOT the file you are meant to edit.
#
# User-editable configuration lives in  backend/config/application.yml  , which Spring Boot loads
# from ./config/ at startup and which overrides everything here. This file only exists so the app
# still starts correctly, and still binds to loopback, if that file is deleted.
spring.application.name=genvn

# Local-first: never bind beyond loopback unless the config file says otherwise.
server.address=127.0.0.1
server.port=8080

# Framework internals -- there is no reason to change these from the config file.
# Keep nulls: the client and the dev inspector rely on an explicit, stable shape.
spring.jackson.default-property-inclusion=always
spring.mvc.async.request-timeout=180000
logging.level.com.genvn=INFO
